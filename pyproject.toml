[project]
name = "hitl-agent"
version = "1.0.0"
description = "Human in the loop in code, not in the prompt: complaint agent, pseudonymization, policy, approvals, Claude Code hooks"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "mcp>=2.3,<3",
    "presidio-analyzer>=2.2",
    "pl-core-news-lg",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
pl-core-news-lg = { url = "https://github.com/explosion/spacy-models/releases/download/pl_core_news_lg-3.8.0/pl_core_news_lg-3.8.0-py3-none-any.whl" }
